<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TAudioMagic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a href="taudiomagic.html" class="nav-btn">TAudioMagic</a>
      <a href="index.html" class="nav-btn">Home</a>
    </nav>
  </header>
  <main class="wrap">
    <h1>TAudioMagic</h1>
    <div class="player">
      <div class="track-select">
        <button data-track="original" class="active">Original</button>
        <button data-track="ai">Just AI</button>
        <button data-track="fix">My Fix + AI</button>
      </div>
      <button id="play-pause">Play</button>
      <audio id="audio" src="Original.mp3" loop></audio>
    </div>
  </main>
  <footer>
    <p>Tony's Automation and Media</p>
    <div class="contact-info">
      <p>אנטון זצ'וסוב</p>
      <p>בני בנימין 3 דירה 28</p>
      <p>נתניה, 4201959</p>
      <p>contentmage@tonysautomedia.com</p>
    </div>
  </footer>
  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play-pause');
    const trackBtns = document.querySelectorAll('.track-select button');
    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = 'Pause';
      } else {
        audio.pause();
        playBtn.textContent = 'Play';
      }
    }
    function setTrack(src, btn) {
      const time = audio.currentTime;
      const playing = !audio.paused;
      audio.src = src;
      audio.currentTime = time;
      if (playing) {
        audio.play();
        playBtn.textContent = 'Pause';
      }
      trackBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    playBtn.onclick = togglePlay;
    trackBtns.forEach(btn => {
      btn.onclick = () => {
        const files = {
          original: 'Original.mp3',
          ai: 'Just AI.mp3',
          fix: 'My fix plus AI.mp3'
        };
        setTrack(files[btn.dataset.track], btn);
      };
    });
  </script>
</body>
</html>
